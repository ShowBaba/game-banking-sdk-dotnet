# Publishes GameBanking to nuget.org via Trusted Publishing (OIDC).
# One-time setup: nuget.org → Trusted Publishing → repo ShowBaba/game-banking-sdk-dotnet,
# workflow publish.yml, glob GameBanking. GitHub secret NUGET_USER = nuget.org profile name.
name: Publish to NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Require NUGet trusted publishing secret
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set repository secret NUGET_USER to your nuget.org username (profile name, not email)."
            exit 1
          fi

      - name: Validate tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/GameBanking/GameBanking.csproj)
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match csproj Version ($PROJECT_VERSION)"
            exit 1
          fi

      - run: dotnet test tests/GameBanking.Tests/GameBanking.Tests.csproj
      - run: dotnet pack src/GameBanking/GameBanking.csproj -c Release -o dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: dist/*.nupkg

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push dist/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
